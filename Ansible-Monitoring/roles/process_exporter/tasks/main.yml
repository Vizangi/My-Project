  register: port_listen_check
  ignore_errors: yes
  changed_when: false
  # failed_when: port_listen_check.rc != 0 # Эта проверка должна пройти
  when: process_exporter_process_check.rc != 0 # Проверяем порт только если пытались запустить

- name: Debug: Show port check result
  ansible.builtin.debug:
    msg: "Port 9256 check result (rc={{ port_listen_check.rc }}): {{ port_listen_check.stdout }}"
  when: process_exporter_process_check.rc != 0 # Показываем только если пытались запустить
