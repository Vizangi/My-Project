--- # Файл tasks/main.yml для роли process_exporter (Task 1: Установка И Запуск/Проверка)

# Эта роль устанавливает, запускает и проверяет Process Exporter на целевых хостах.
# Она обходит использование systemd_service, управляя сервисом вручную для Docker контейнеров.

- name: Install required packages (python, sudo, basic tools for script)
  ansible.builtin.apt:
    name:
      - sudo # Убедимся, что установлен (нужен для become: yes)
      - python3 # Нужен Ansible
      - python3-apt # Нужен модулю apt
      # Добавляем базовые утилиты, используемые в скриптах установки/проверки
      - procps # Для 'ps'
      - grep # Для 'grep'
      - findutils # Для 'find'
      - iproute2 # Для 'ss'
      - net-tools # Для 'netstat'
      - curl # Удобная утилита для проверки метрик
      - nano # Удобный редактор (необязательно, но полезно)
    state: present
    update_cache: yes # Убедимся, что кэш пакетов обновлен
  become: yes # Выполняем с правами root

- name: Create prometheus group
  ansible.builtin.group:
    name: "{{ process_exporter_group }}" # Имя группы берем из переменных роли (defaults/main.yml)
    system: yes # Создаем как системную группу
  become: yes

- name: Create process_exporter user and group
  ansible.builtin.user:
    name: "{{ process_exporter_user }}" # Имя пользователя берем из defaults/main.yml
    group: "{{ process_exporter_group }}"
    create_home: no # Не создаем домашнюю директорию
    system: yes # Создаем как системного пользователя
    shell: /sbin/nologin # Оболочка без возможности логина
  become: yes

- name: Download process_exporter binary archive
  ansible.builtin.get_url:
    url: "{{ process_exporter_download_url }}" # URL из defaults/main.yml
    dest: "/tmp/process_exporter.tar.gz" # Скачиваем во временную директорию
    mode: '0644'
#    checksum: sha256:b8b9c0e5a9a47a03a872b7a5a3a111b5b81d2b6c52d2b0d8b8a8d5c5c5a8d5c5 # Опционально: Добавляем контрольную сумму для проверки целостности
  become: yes # Требуются права root для записи в /tmp или от имени пользователя

- name: Extract process_exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/process_exporter.tar.gz"
    dest: "/tmp"
    remote_src: yes # Источник находится на удаленном хосте
    creates: "/tmp/process-exporter-{{ process_exporter_version }}.linux-amd64/process-exporter" # Идемпотентность: выполнять, только если бинарник не извлечен
  become: yes

- name: Copy binary to system directory
  ansible.builtin.copy:
    src: "/tmp/process-exporter-{{ process_exporter_version }}.linux-amd64/process-exporter" # Путь к извлеченному бинарнику в /tmp
    dest: "{{ process_exporter_binary_dir }}/process-exporter" # Целевой путь в системе (из defaults/main.yml)
    owner: "{{ process_exporter_user }}" # Владелец - пользователь process_exporter
    group: "{{ process_exporter_group }}" # Группа - prometheus
    mode: '0755' # Права на исполнение
    remote_src: yes # Источник находится на удаленном хосте
  become: yes

- name: Create systemd service file # Создаем unit файл (для порядка, даже если systemd не работает)
  ansible.builtin.template:
    src: process_exporter.service.j2 # Название шаблона в templates/
    dest: "/etc/systemd/system/process_exporter.service" # Целевой путь для unit файла
    owner: root # systemd файлы принадлежат root
    group: root
    mode: '0644'
  become: yes
  # notify: ... # НЕ используем notify для systemd

# --- ЗАДАЧИ ПРОВЕРКИ И ЗАПУСКА (Обход systemd) ---
# ЭТИ ЗАДАЧИ ЗАМЕНЯЮТ ИСПОЛЬЗОВАНИЕ systemd_service

- name: Check if process_exporter process is running # Проверяем, запущен ли процесс напрямую
  ansible.builtin.shell: "ps aux | grep -v grep | grep '{{ process_exporter_binary_dir }}/process-exporter --web.listen-address=:{{ process_exporter_port }}'" # <-- ИЩЕМ ПОЛНУЮ КОМАНДУ С АРГУМЕНТАМИ
  register: process_exporter_process_check
  ignore_errors: yes # Больше не нужно ignore_errors, т.к. grep всегда возвращает 0
  changed_when: false # Эта задача не меняет состояние
  failed_when: false # Больше не нужно, т.к. grep всегда возвращает 0 или мы обрабатываем это
  become: yes # Требуются права root для ps aux
#  when: process_exporter_process_check.rc != 0

- name: Start process_exporter process if not running # Запускаем процесс, если он не найден
  ansible.builtin.command:
    cmd: "{{ process_exporter_binary_dir }}/process-exporter --web.listen-address=:{{ process_exporter_port }} &" # Запускаем бинарник в фоне
  become: yes # Требуются права root для запуска в системный каталог и от пользователя process_exporter
  when: process_exporter_process_check.rc != 0 # Выполнять, если grep в предыдущей задаче не нашел процесс (rc != 0)
  # changed_when: process_exporter_process_check.rc != 0 # Опционально: помечать как changed, только если пришлось запустить

# --- ВРЕМЕННЫЕ ЗАДАЧИ ДЛЯ ОТЛАДКИ ЗАПУСКА ---
- name: Debug: Wait a moment after starting process (optional)
  ansible.builtin.pause:
    seconds: 5
  when: process_exporter_process_check.rc != 0 # Пауза только если мы только что его запустили

- name: Debug: Check processes again after potential start
  ansible.builtin.shell: "ps aux | grep -v grep | grep '{{ process_exporter_binary_dir }}/process-exporter --web.listen-address=:{{ process_exporter_port }}'"
  register: process_exporter_process_check_after_start
  ignore_errors: yes
  changed_when: false
  when: process_exporter_process_check.rc != 0 # Проверяем только если пытались запустить
  failed_when: process_exporter_process_check_after_start.rc != 0 # Эта проверка должна пройти

- name: Debug: Show process check result after start
  ansible.builtin.debug:
    msg: "Process check result after start (rc={{ process_exporter_process_check_after_start.rc }}): {{ process_exporter_process_check_after_start.stdout }}"
  when: process_exporter_process_check.rc != 0 # Показываем только если пытались запустить

- name: Debug: Check if port 9256 is listening (inside container)
  ansible.builtin.shell: "ss -tulnp | grep 9256 || exit 1" # Ищем процесс, слушающий на порту 9256
  register: port_listen_check
  ignore_errors: yes
  changed_when: false
  # failed_when: port_listen_check.rc != 0 # Эта проверка должна пройти
  when: process_exporter_process_check.rc != 0 # Проверяем порт только если пытались запустить

- name: Debug: Show port check result
  ansible.builtin.debug:
    msg: "Port 9256 check result (rc={{ port_listen_check.rc }}): {{ port_listen_check.stdout }}"
  when: process_exporter_process_check.rc != 0 # Показываем только если пытались запустить
# --- КОНЕЦ ВРЕМЕННЫХ ЗАДАЧ ОТЛАДКИ ---

# --- ЗАДАЧИ ПРОВЕРКИ ДОСТУПНОСТИ МЕТРИК ---

- name: Wait for Process Exporter port to be available # Ждем, пока порт станет доступен
  ansible.builtin.wait_for:
    port: "{{ process_exporter_port }}"
    delay: 5 # Задержка перед первой проверкой
    timeout: 60 # Максимальное время ожидания (в секундах)
    state: present # Ждем, пока порт будет открыт
    host: 127.0.0.1 # Проверяем порт на локальном хосте (т.е. внутри контейнера)
    connect_timeout: 1

- name: Check Process Exporter metrics endpoint # Проверяем доступность /metrics
  ansible.builtin.uri:
    url: "http://localhost:{{ process_exporter_port }}/metrics"
    status_code: 200 # Ожидаем статус 200 OK
    timeout: 10
  register: process_exporter_metrics_check

- name: Display metrics check result # Выводим результат проверки метрик
  ansible.builtin.debug:
    msg: "Process Exporter metrics check status: {{ process_exporter_metrics_check.status }}"

# Задача на удаление временного архива (опционально)
- name: Clean up downloaded archive
  ansible.builtin.file:
    path: "/tmp/process_exporter.tar.gz"
    state: absent
  become: yes

# --- ВРЕМЕННЫЕ ЗАДАЧИ ДЛЯ ОТЛАДКИ ЗАПУСКА ---
- name: Debug: Wait a moment after starting process (optional)
  ansible.builtin.pause:
    seconds: 5
  when: process_exporter_process_check.rc != 0 # Пауза только если мы только что его запустили

- name: Debug: Check processes again after potential start
  ansible.builtin.shell: "ps aux | grep -v grep | grep '{{ process_exporter_binary_dir }}/process-exporter --web.listen-address=:{{ process_exporter_port }}'"
  register: process_exporter_process_check_after_start
  ignore_errors: yes
  changed_when: false
  when: process_exporter_process_check.rc != 0 # Проверяем только если пытались запустить
  failed_when: process_exporter_process_check_after_start.rc != 0 # Эта проверка должна пройти

- name: Debug: Show process check result after start
  ansible.builtin.debug:
    msg: "Process check result after start (rc={{ process_exporter_process_check_after_start.rc }}): {{ process_exporter_process_check_after_start.stdout }}"
  when: process_exporter_process_check.rc != 0 # Показываем только если пытались запустить

